<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        body{
            font-family: 'Work Sans', Arial, Helvetica, sans-serif;
            font-size: 1em;
            color: black;
        }
        h1 {
            font-family: 'Kaushan Script','Times New Roman', Times, serif;
            font-size: 3em;
            color: rgb(15, 9, 0);
        }
        h2 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5em;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi quasi optio deserunt quisquam. Ut possimus dolor magni nobis vero pariatur tempora sequi, veritatis a, nesciunt obcaecati, exercitationem quasi aspernatur quo?</p>
    <h2>Subtítulo</h2>
</body>
</html>
